# Settings of dragongl-server.service (systemd EnvironmentFile).
#
# The passwords are not here: they are files the service reads as systemd
# credentials (root-only, mode 0600; 8-63 printable ASCII characters, no
# spaces, on the first line):
#   /etc/dragongl/server-password  server access password (required: the
#                                  service does not start without it)
#   /etc/dragongl/dm-password      Dungeon Master password (optional:
#                                  without it the dm account is disabled)
# For example:
#   install -m 0600 /dev/null /etc/dragongl/server-password
#   sudoedit /etc/dragongl/server-password

# Extra options for dragongl_server, e.g. "--port 9000". The TLS
# certificate is created in /var/lib/dragongl/tls at the first start; for a
# certificate of your own see "TLS identity" in INSTALL.md (--tls-cert and
# --tls-key, passed to the service as credentials).
DRAGONGL_SERVER_ARGS=
