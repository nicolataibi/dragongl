# Settings of dragongl-server.service (systemd EnvironmentFile).
# This file holds passwords: keep it owned by root with mode 0600.
#
# Server access password: required. 8-63 printable ASCII characters,
# no spaces. The service does not start while it is empty.
DRAGONGL_SERVER_PASSWORD=

# Dungeon Master password: optional (empty = the dm account is disabled).
DRAGONGL_DM_PASSWORD=

# Extra options for dragongl_server, e.g. "--port 9000".
DRAGONGL_SERVER_ARGS=
