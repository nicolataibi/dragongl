name: CodeQL

# GitHub code scanning of the C sources: the security-and-quality suite on
# every push and pull request to main, and weekly on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev libcjson-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Client and server, as the distributions ship them: against the cJSON
      # of the system, so that the copy in third_party/ is not compiled and
      # not analysed (it is not our code; its findings go upstream).
      # The findings accepted by design are listed, with the reason, in
      # SECURITY.md ("Code scanning").
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDRAGONGL_SYSTEM_CJSON=ON
          cmake --build build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
