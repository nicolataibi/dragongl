name: CodeQL

# GitHub code scanning of the C sources: the security-and-quality suite on
# every push and pull request to main, and weekly on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libglfw3-dev libvulkan-dev glslc libsodium-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Client and server, as shipped. A compiled build is analyzed whole:
      # an alert in vendored code (src/shared/cJSON.c) is dismissed in the
      # Security tab with the reason, or fixed upstream.
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
