name: Release

# A tag named as a version (YYYY.MM.DD.NN) publishes a GitHub release:
# the source tarball, the source RPM, the RPMs built on Fedora and their
# SHA-256 sums, with the CHANGELOG.md entry of the version as notes.
# COPR builds its own packages from the same tag (docs/RELEASING.md).
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 45
    steps:
      - name: Install packaging tools
        run: dnf -y install git gh rpm-build rpmlint python3 glibc-langpack-en 'dnf-command(builddep)'

      - uses: actions/checkout@v4

      # The tag must be the version of dragongl.spec and of the newest
      # CHANGELOG.md entry: a tag on the wrong commit publishes nothing.
      - name: Tag, version and changelog agree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^Version:[[:space:]]*//p' dragongl.spec)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but dragongl.spec says $version" >&2
            exit 1
          fi
          python3 tools/check_release.py

      - name: Source tarball, spec and source RPM
        run: tools/release.sh --srpm

      - name: Build dependencies
        run: dnf -y builddep dist/*.src.rpm

      - name: rpmbuild (includes %check)
        run: rpmbuild --rebuild dist/*.src.rpm

      - name: rpmlint
        run: rpmlint -r dragongl.rpmlintrc ~/rpmbuild/RPMS/*/*.rpm dist/*.src.rpm

      - name: Files of the release
        run: |
          cp ~/rpmbuild/RPMS/*/*.rpm dist/
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          python3 ../tools/check_release.py --notes "$GITHUB_REF_NAME" > ../notes.md

      # A release that already exists for the tag (the job was run again)
      # gets its files replaced.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Dragon GL $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
