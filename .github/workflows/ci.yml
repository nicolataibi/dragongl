name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Optional Vulkan validation layers: the client enables whatever is listed
# here (VK_INSTANCE_LAYERS) when the driver provides the layer. Any job
# that runs the client inherits it; developers get the same behavior
# locally with the same variable.
env:
  VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
  SANITIZE_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer

jobs:
  build:
    name: Build (${{ matrix.cc }}, -Werror)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev

      - name: Configure (Release, warnings are errors)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror \
            -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build

  unit-tests:
    name: Unit tests (Release + ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build pkg-config \
            libglfw3-dev libvulkan-dev vulkan-validationlayers glslc python3 \
            mesa-vulkan-drivers libssl-dev

      - name: Configure (Release)
        run: cmake -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release tests

      - name: Build
        run: cmake --build build-tests

      - name: Run
        run: ctest --test-dir build-tests --output-on-failure

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -B build-tests-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug tests \
            -DCMAKE_C_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan/UBSan)
        run: cmake --build build-tests-asan

      - name: Run (ASan/UBSan)
        run: ctest --test-dir build-tests-asan --output-on-failure

  integration-tests:
    name: Server integration tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The server needs no graphics stack: compiler, CMake and Python only.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build pkg-config \
            libsodium-dev libssl-dev python3

      - name: Configure
        run: |
          cmake -B build-integration -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang tests/integration \
            -DCMAKE_C_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-integration

      - name: Run
        run: ctest --test-dir build-integration --output-on-failure

  client-smoke:
    name: Client smoke test (Xvfb + lavapipe + validation, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The real client renders on a virtual display with Mesa's software
      # Vulkan driver; any validation message fails the test.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build pkg-config \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev \
            mesa-vulkan-drivers vulkan-validationlayers xvfb python3 python3-xlib

      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="$SANITIZE_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Run
        env:
          DRAGONGL_CLIENT_TEST_REQUIRE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: python3 tests/client/test_client.py

  server-only:
    name: Server-only build (no graphics stack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A headless server host: no Vulkan, GLFW or glslc installed.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libsodium-dev libssl-dev

      - name: Configure (DRAGONGL_BUILD_CLIENT=OFF)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror \
            -DDRAGONGL_BUILD_CLIENT=OFF -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build and install
        run: |
          cmake --build build
          DESTDIR="$PWD/stage" cmake --install build
          ./stage/usr/bin/dragongl_server --version

  rpm:
    name: RPM build and rpmlint (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      # glibc-langpack-en: the en_US.UTF-8 locale of the runner environment
      # (rpm's shells warn without it, and rpmlint spell-checks in en_US).
      - name: Install packaging tools
        run: dnf -y install git rpm-build rpmlint python3 glibc-langpack-en 'dnf-command(builddep)'

      - uses: actions/checkout@v4

      # The tarball, the spec and the source RPM of a release, made by the
      # script that makes them for a release (tools/release.sh): %autorelease
      # and %autochangelog, which rpmautospec expands on COPR and Koji, become
      # release 1 and the entries of CHANGELOG.md.
      - name: Source tarball, spec and source RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/release.sh --srpm

      - name: Build dependencies
        run: dnf -y builddep dist/*.src.rpm

      - name: rpmbuild (includes %check)
        run: rpmbuild --rebuild dist/*.src.rpm

      - name: rpmlint
        run: rpmlint -r dragongl.rpmlintrc ~/rpmbuild/RPMS/*/*.rpm dist/*.src.rpm

  release-checks:
    name: Command reference, man pages, reproducible build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config mandoc \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev

      # docs/COMMANDS.md is generated from the command table of the server.
      - name: Command reference
        run: tools/quality.sh commands

      - name: Man pages (mandoc -T lint)
        run: tools/quality.sh man

      # Two copies of the tree at different paths install identical files.
      - name: Reproducible build
        run: tools/quality.sh repro

      # The tarball of a commit is the same bytes every time.
      - name: Reproducible source tarball
        run: |
          tools/release.sh && cp dist/SHA256SUMS "$RUNNER_TEMP/first"
          sleep 2
          tools/release.sh && diff "$RUNNER_TEMP/first" dist/SHA256SUMS

  lint:
    name: Format, game data, spelling, metrics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 cmake python3 python3-jsonschema
          # codespell of PyPI: the dictionary of Ubuntu's 2.2 misses words.
          pipx install codespell==2.4.3

      # Style of .clang-format; tools/quality.sh format-fix applies it.
      - name: clang-format
        run: tools/quality.sh format

      # Schema (data/schema), references and canonical form of data/*.json.
      - name: Game data
        run: tools/quality.sh data

      # codespell (.codespellrc) on data, documentation, man pages and sources.
      - name: Spelling
        run: tools/quality.sh spelling

      # Layers of the source tree and include cycles (tools/check_deps.py).
      - name: Dependencies
        run: tools/quality.sh deps

      # Function and file length against tools/quality_limits.json.
      - name: Metrics
        run: tools/quality.sh metrics

      # The codec, the conformance test, the vectors and PROTOCOL.md are
      # generated from protocol/messages.json: none may be stale.
      - name: Generated protocol files
        run: tools/quality.sh protocol

  clang-tidy:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The four trees are configured for their compile_commands.json, so
      # the dependencies of every target are needed.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy-18 cmake ninja-build pkg-config python3 \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev

      - name: clang-tidy
        run: tools/quality.sh tidy

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm-18 cmake ninja-build pkg-config python3 \
            libglfw3-dev libvulkan-dev glslc libsodium-dev libssl-dev

      # Fails under the coverage_line_percent of tools/quality_limits.json;
      # metrics then lists every number next to its limit.
      - name: Coverage
        run: tools/quality.sh coverage metrics

      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage (src/server + src/shared)'
            echo '```'
            tail -n 1 build-quality/coverage/report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-quality/coverage/html
            build-quality/coverage/report.txt
            build-quality/coverage/summary.json
            build-quality/metrics.json
          if-no-files-found: ignore

  tsan:
    name: Server integration tests (ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build pkg-config libsodium-dev libssl-dev python3

      # Recent runner kernels randomize the address space more than the
      # TSan runtime of clang 18 accepts.
      - name: Address-space randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: ThreadSanitizer
        run: tools/quality.sh tsan

  fuzz:
    name: Fuzzing (libFuzzer, 60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build pkg-config libsodium-dev libssl-dev python3

      - name: Fuzz
        run: tools/quality.sh fuzz 60

      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            build-quality/fuzz/artifacts
            build-quality/fuzz/logs
          if-no-files-found: ignore

  # The same build and tests on Fedora (gcc, OpenSSL and libsodium of the
  # distribution the package targets); Ubuntu runs them with clang above.
  fedora:
    name: Build and tests (Fedora, gcc and clang)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf -y install git gcc clang cmake ninja-build python3 glslc \
            'pkgconfig(glfw3)' 'pkgconfig(vulkan)' 'pkgconfig(libsodium)' \
            'pkgconfig(openssl)'

      - uses: actions/checkout@v4

      - name: Build (Release, warnings are errors)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build

      # The clang of Fedora is newer than the one pinned on Ubuntu (18) and
      # has warnings that one lacks: the project and the tests must build
      # without any.
      - name: Build with the current clang (warnings are errors)
        run: |
          for src in . tests tests/integration; do
            dir="build-clang/$src"
            cmake -S "$src" -B "$dir" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS=-Werror -DCMAKE_C_COMPILER=clang
            cmake --build "$dir"
          done

      - name: Server integration tests
        run: |
          cmake -B build-integration -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc tests/integration
          cmake --build build-integration
          ctest --test-dir build-integration --output-on-failure

  # The round with 64 characters in a full world, the autosave, then 64
  # TLS clients on a real server for a minute and a shutdown under load:
  # all against tests/bench_limits.json. The 30-minute run is nightly
  # (load-nightly.yml).
  performance:
    name: Benchmark and load test (64 clients)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libsodium-dev libssl-dev python3

      - name: Benchmark of the round
        run: tools/quality.sh bench

      - name: Load test
        run: tools/quality.sh load 60

      - name: Measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: |
            build-quality/release/bench.json
            build-quality/release/load.json
          if-no-files-found: ignore

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      # The version has one source (dragongl.spec); CHANGELOG.md must agree.
      - name: Release consistency
        run: python3 tools/check_release.py

      # cJSON is vendored third-party code and is not analysed. False
      # positives are suppressed inline (// cppcheck-suppress) with a
      # comment that explains why. The tree is not configured, so the
      # macros of the generated dragongl_config.h are given here.
      - name: cppcheck
        run: |
          cppcheck -q -j "$(nproc)" --enable=warning,portability \
            --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -D_DEFAULT_SOURCE -DDRAGONGL_VERSION='"0"' \
            -DDRAGONGL_PKGDATADIR='"/usr/share/dragongl"' \
            -Iinclude -Isrc/server -Isrc/client \
            -i src/shared/cJSON.c src
